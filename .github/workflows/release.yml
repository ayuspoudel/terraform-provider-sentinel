name: CI, Validation, and Conditional Release

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: write

env:
  GO_VERSION: "1.22"

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: go test ./...

  snapshot:
    name: GoReleaser Snapshot (PRs only)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean

  validate-release:
    name: Validate Release Intent
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    outputs:
      version: ${{ steps.extract.outputs.version }}

    steps:
      - name: Extract version from commit message
        id: extract
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" =~ RELEASE-(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "No release requested"
            exit 0
          fi
          
      - name: Prevent accidental v1.0.0
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          if [[ "$VERSION" =~ ^v1\.0\.0$ ]] && [[ "${ALLOW_V1:-false}" != "true" ]]; then
            echo "v1.0.0 is blocked until explicitly enabled"
            exit 1
          fi

      - name: Validate SemVer
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

  release:
    name: Release Terraform Provider
    runs-on: ubuntu-latest
    needs: validate-release
    if: needs.validate-release.outputs.version != ''

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Enforce maintainer-only release
        run: |
          ACTOR="${{ github.actor }}"
          ALLOWED=("ayuspoudel")
          if [[ ! " ${ALLOWED[@]} " =~ " ${ACTOR} " ]]; then
            echo "User $ACTOR is not allowed to release"
            exit 1
          fi

      - name: Create Git tag
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
