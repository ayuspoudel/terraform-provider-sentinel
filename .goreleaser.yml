version: 2

project_name: terraform-provider-sentinel

before:
  hooks:
    - go mod tidy

builds:
  - id: sentinel
    main: .
    binary: terraform-provider-sentinel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w"

archives:
  - formats:
      - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    cmd: gpg
    args:
      - "--detach-sign"
      - "--armor"
      - "--output"
      - "${signature}"
      - "${artifact}"

release:
  github:
    owner: ayuspoudel
    name: terraform-provider-sentinel
  draft: false
  prerelease: auto

changelog:
  disable: true
